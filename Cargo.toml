[package]
name = "nilauth"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
axum-prometheus = "0.8"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
config = { version = "0.15", default-features = false, features = ["yaml"] }
convert_case = "0.8"
hex = { version = "0.4", features = ["serde"] }
itertools = "0.14"
metrics = "0.24"
nillion-nucs = { git = "https://github.com/NillionNetwork/nuc-rs", rev = "27c075aa2300f5f5abd3d9fd02189216f6675917" }
alloy = { version = "1.1.3", features = ["provider-http", "contract", "rpc-types"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rust_decimal = { version = "1.39", features = ["serde-float", "serde-arbitrary-precision"] }
serde = { version = "1.0", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1.0"
serde_with = { version = "3.14", features = ["hex"] }
strum = { version = "0.27", features = ["derive"] }
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "chrono"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt"] }
opentelemetry = { version = "0.31", default-features = false, features = ["logs", "trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["rt-tokio", "logs", "trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["grpc-tonic", "logs", "trace"] }
opentelemetry-appender-tracing = "0.31"
opentelemetry-resource-detectors = "0.10"
tracing-opentelemetry = "0.32"
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "time", "signal"] }
tower-http = { version = "0.6", features = ["cors"] }
utoipa = { version = "5.3.1", features = ["chrono", "axum_extras"] }
utoipa-axum = "0.2.0"

[target.'cfg(target_os = "linux")'.dependencies]
procfs = "0.18"

[dev-dependencies]
alloy = { version = "1.1.3", features = ["provider-http", "contract", "rpc-types", "signer-local", "network"] }
libc = "0.2"
mockall = "0.13"
nilauth-client = { git = "https://github.com/NillionNetwork/nilauth-client-rs", rev = "680c2f2aa2105a4aa764210c97ceb7bca44c2ff6" }
rand = "0.8"
rstest = { version = "0.25", default-features = false }
serial_test = "3"
testcontainers-modules = { version = "0.11", features = ["blocking", "postgres"] }
